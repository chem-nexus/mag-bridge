[paths]
home = /usr/local/grafana
provisioning = ${SERVICES_DIR}/grafana/provisioning
data = /tmp/grafana/data
logs = /tmp/grafana/logs
plugins = /tmp/grafana/plugins

[server]
http_port = 3000

[auth.basic]
enabled = false

[auth]
disable_login_form = true

[dashboards]
newsfeed = false

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Admin

[analytics]
reporting_enabled = false
check_for_updates = false

[security]
admin_user = admin
admin_password = admin