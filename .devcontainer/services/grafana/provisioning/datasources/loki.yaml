# Grafana datasource provisioning — loaded automatically by grafana-server on start.
# VS Code YAML validator may flag 'datasources' — this is a false positive; format is correct.
apiVersion: 1
datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://localhost:3100
    isDefault: true
    jsonData:
      maxLines: 1000
